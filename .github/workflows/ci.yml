name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Every extra the default (fast) test suite imports. NOT installed: the spaCy model
      # en_core_web_lg and the datasets, so tests that need them (-m models / -m data / -m slow)
      # are deselected by the pytest configuration and the rest must pass without them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data,detectors,ml,masking,gateway,plots]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
